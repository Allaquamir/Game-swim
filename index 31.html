<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swim Career</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b2d38;--pn:#263b49;--pn2:#2f4a5a;--dk:#14232c;--gr:#5bbf9f;--g:#5bbf9f;--g2:#8be3c4;--y:#e8dc4a;--bl:#2f8ff0;--tx:#eef7f3;--t:#eef7f3;--m:#8fb5aa;--on:#0d2f26;--p:#263b49;--ov:rgba(255,255,255,.08);--ln:rgba(255,255,255,.12);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Oswald,"Arial Narrow","Roboto Condensed",system-ui,sans-serif;letter-spacing:.2px}
body{max-width:520px;margin:auto;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#2f8f78;z-index:6}
.hb,.gh{display:flex;align-items:center;gap:7px;background:linear-gradient(#3fae90,#2f8f78);color:#fff;padding:7px 10px;font-size:13px;font-weight:600;border-bottom:2px solid #24705e}
.hb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hb .ic{width:18px;height:18px;border:2px solid #cfeee4;border-radius:50%;font-size:11px;text-align:center;line-height:14px}
.en{flex:1;max-width:52px;height:16px;background:#12332a;border:2px solid #cfeee4;border-radius:4px;overflow:hidden}.en i{display:block;height:100%;background:#62e062}
.cal{margin-left:auto;width:28px;height:28px;border:2px solid #eaffe8;border-radius:7px;text-align:center;line-height:24px;background:#3fae90}
.ttl{text-align:center;background:linear-gradient(#58c3a2,#46a98b);font-size:21px;text-transform:uppercase;letter-spacing:1.5px;padding:9px;color:#fff;border-bottom:3px solid #2f8570;font-weight:600}
.wall{position:relative;height:310px;display:flex;justify-content:center;align-items:flex-end;background:repeating-linear-gradient(90deg,#2d5d51 0 20px,#295549 20px 40px);overflow:hidden}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:#25483f}
.wall svg{position:relative;z-index:1;margin-bottom:10px;height:280px}
.arw{position:absolute;top:42%;z-index:2;background:none;color:var(--gr);font-size:54px;line-height:1;padding:0 8px}
.eqn{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;color:#bfe7da;z-index:2}
.pn,.card{background:var(--pn);border-radius:10px;padding:12px;margin:10px}.c{padding:0}
.m{color:var(--m);font-size:13px;font-weight:400}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
h3{margin:0 0 8px;font-size:18px;text-transform:uppercase;letter-spacing:1px}
button,select,input{font:inherit;border:0;border-radius:6px;padding:11px 14px}
.b{background:var(--gr);color:#0d2f26;font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:1px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);cursor:pointer}.b:active{transform:translateY(1px)}
.b.y{background:var(--y);color:#33300a}.b.o{background:var(--pn2);color:#fff;box-shadow:none}.b.bl{background:var(--bl);color:#fff}.b:disabled{opacity:.4}.w{width:100%}
select,input{background:var(--dk);color:var(--tx);width:100%;margin:4px 0;border:1px solid #3a5a68}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:linear-gradient(#58c3a2,#45a88a);border-top:3px solid #2f8570;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;background:none;border-radius:0;font-size:27px;padding:9px 0;filter:brightness(0) opacity(.7)}.nav .on{background:rgba(255,255,255,.28);filter:brightness(0)}
.bar{height:12px;background:#10211a;border:2px solid #3a6a5c;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd35f,#e8dc4a)}
.tag{background:var(--y);color:#33300a;border-radius:5px;padding:2px 8px;font-weight:600;font-size:12px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--g2);text-transform:uppercase;font-weight:600}
.ms{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--ln);font-size:14px}.ms.cur{background:rgba(91,191,159,.2);border-radius:6px;font-weight:600}.ms.dn{opacity:.5}.ms span:first-child{font-size:22px}
.slime{position:relative;background:var(--gr);color:#0d2f26;border-radius:16px;padding:10px 12px 10px 34px}
.slime::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:22px;background:radial-gradient(circle at 0 16%,var(--bg) 11px,transparent 12px),radial-gradient(circle at 0 50%,var(--bg) 11px,transparent 12px),radial-gradient(circle at 0 84%,var(--bg) 11px,transparent 12px)}
.slime small{display:block;font-size:12px;font-weight:400;opacity:.85}
.tr{display:flex;gap:4px;margin:10px}.tr .slime{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer}.big{font-size:34px}.tr.on .slime{outline:3px solid var(--y)}
.sp{width:36px;flex:none;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff}.sp.r{background:#e0453c}.sp.y{background:#e8c53a;color:#33300a}.sp.g{background:#58b95a}
.tabs2{display:flex}.tb{flex:1;border-radius:0;background:var(--pn2);color:#cfe;font-size:17px;text-transform:uppercase;padding:12px;font-family:inherit}.tb.on{background:var(--dk);color:#fff}
.coach{display:flex;margin:10px;align-items:stretch}.face{width:78px;flex:none;display:flex;align-items:center}.face svg{width:70px}.coach .slime{flex:1;padding:8px 10px 8px 30px}
.cst{display:flex;gap:12px;margin-bottom:6px}.cst div{text-align:center;font-size:14px}.cst span{display:block}.cpr{display:flex;justify-content:space-between;align-items:center;gap:8px}.cpr small{max-width:150px;line-height:1.2}
.gridt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{aspect-ratio:1;background:#202f3a;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;cursor:pointer;gap:2px}.tile small{font-size:11px;color:var(--y)}.tile.ow{box-shadow:inset 0 0 0 2px var(--gr)}.tile.sel{outline:2px solid var(--y)}
.cond{display:flex;gap:12px;background:#1e3a34}.sl{flex:1;display:flex;align-items:center;gap:6px;font-size:20px}.cb{flex:1;height:14px;background:#0f211b;border:2px solid #3a6a5c;border-radius:3px;overflow:hidden}.cb i{display:block;height:100%}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;border:2px solid var(--gr);padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center}
#gm{position:fixed;inset:0;z-index:20;background:#dde2e5;display:none}
.gi{max-width:520px;margin:auto;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
#cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.hud{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--dk);color:#fff;font-size:14px;font-weight:600}.hud .bar{flex:1}
.ctl{display:flex;gap:10px;padding:10px 12px 14px;background:var(--dk)}.ctl button{flex:1;height:96px;font-size:34px;border-radius:12px;user-select:none;touch-action:manipulation}
.side{position:absolute;right:10px;top:34%;display:flex;flex-direction:column;gap:12px;z-index:3}.rb{width:40px;height:40px;border-radius:50%;border:3px solid #4aa0d6;background:rgba(255,255,255,.75);color:#2a82c0;font-weight:700;padding:0;font-size:13px}
#msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:700;color:#fff;text-shadow:0 3px 10px rgba(0,40,100,.8);pointer-events:none;text-transform:uppercase}
#rs{position:absolute;inset:0;background:rgba(5,20,30,.7);display:none;align-items:center;justify-content:center;padding:10px}#rs .card{width:100%;max-height:92%;overflow:auto;margin:0}
.rb2{width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#10242d;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.4);flex:none;text-align:center;line-height:1.05}.rb2 b{font-size:15px}.rb2 small{font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.pfb{position:relative;margin:10px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#3fae90,#1d6f8f 60%,#14405e);padding:14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.pfb::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:36px;background:radial-gradient(circle at 18px 0,transparent 15px,rgba(255,255,255,.14) 16px) 0 0/36px 36px repeat-x}
.pfa{position:relative;z-index:1}.pfa svg{height:210px;display:block}.pfn{font-size:26px;font-weight:600;line-height:1.1}.m2{font-size:14px;color:#d6f3ea}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px}.tl{background:var(--pn);border-radius:12px;padding:10px 12px}.tl b{display:block;font-size:22px;color:var(--y)}.tl span{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.5px}
.pbr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}.mini{width:40px;height:40px;border-radius:50%;font-size:11px;font-weight:700;color:#10242d;display:flex;align-items:center;justify-content:center;text-align:center;flex:none}
.seg2{display:flex;gap:6px;margin:10px 0}.seg2 .b{flex:1;padding:9px 4px;font-size:13px}

/* Minimal 2D refresh */
:root{--bg:#101d2b;--pn:#17283a;--pn2:#21384d;--dk:#0b1521;--gr:#63dfc1;--g:#63dfc1;--g2:#9cebd8;--y:#f3d36b;--bl:#5aa9ff;--tx:#f2f7fb;--t:#f2f7fb;--m:#91a8bc;--on:#092c28;--p:#17283a;--ov:rgba(255,255,255,.05);--ln:rgba(255,255,255,.09)}
html,body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}
body{max-width:520px;background:radial-gradient(ellipse at 50% -10%,#203b50 0, var(--bg) 54%)}
body::before{background:#101d2b}
.hb,.gh{background:#14283a;border:0;border-bottom:1px solid #294156;padding:10px 14px}
.hb .ic{border-color:#63dfc1;color:#63dfc1}
.en{border:0;background:#29394a;height:5px;border-radius:10px}.en i{background:#63dfc1;border-radius:10px}
.cal{border:1px solid #365269;border-radius:9px;background:#20384b}
.ttl{background:transparent;color:#f2f7fb;border:0;text-align:left;padding:18px 16px 10px;font-size:22px;letter-spacing:-.4px;text-transform:none}
.wall{height:286px;background:linear-gradient(180deg,#1b3448,#142c3c 75%,#112536);border-top:1px solid #294457;border-bottom:1px solid #294457}
.wall::after{height:28px;background:repeating-linear-gradient(90deg,#1a4553 0 34px,#153b49 34px 68px);opacity:.8}
.wall svg{height:260px;filter:none}
.arw{color:#8de7d4;font-size:42px}
.eqn{font-size:11px;color:#d3eee9;letter-spacing:.2px}
.pn,.card{background:#17283a;border:1px solid rgba(173,207,229,.08);border-radius:14px;padding:14px;margin:10px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
h3{font-size:14px;letter-spacing:.6px;text-transform:none;color:#cfe3f0}
.m{color:#91a8bc}
button,select,input{border-radius:10px} button{outline:0} button:focus-visible{outline:2px solid #63dfc1;outline-offset:2px}
.b{background:#63dfc1;color:#08251f;box-shadow:none;text-transform:none;letter-spacing:0;font-size:14px;border-radius:10px}
.b.y{background:#f3d36b;color:#29230e}.b.o{background:#243c51;color:#eaf4fb;border:1px solid #36546a}.b.bl{background:#347fc4}
select,input{background:#0f1d2a;border:1px solid #2a4357}
.nav{background:rgba(15,29,43,.97);border-top:1px solid #2b4356;backdrop-filter:blur(16px)}
.nav button{filter:none!important;color:#7f9bb0;font-size:23px;outline:0;box-shadow:none;background:transparent;border:0;-webkit-appearance:none;appearance:none}.nav button:focus,.nav button:focus-visible,.nav button:active{outline:0;box-shadow:none;background:#1d3a4c;color:#7de7ce}.nav .on{background:#1d3a4c;color:#7de7ce;border-radius:12px;margin:5px}
.bar{height:7px;background:#0c1824;border:0;border-radius:20px}.bar i{background:#63dfc1;border-radius:20px}
.tag{background:#f3d36b;color:#29230e;border-radius:20px}
td,th{border-bottom-color:#2a4052}th{color:#8de7d4}
.slime{background:#1d3a4c;color:#f0f8fb;border-radius:12px}.slime::before{display:none}.slime small{color:#9db4c6;opacity:1}
.tr{margin:8px 10px;gap:7px}.tr .slime{padding:12px;gap:10px}.tr.on .slime{outline:1px solid #f3d36b}
.sp{border-radius:8px;width:30px;font-size:10px}
.tabs2{gap:5px;padding:8px 10px 0}.tb{border-radius:9px;font-size:13px;background:#1d3347;color:#a7bdcc;padding:10px}.tb.on{background:#63dfc1;color:#08251f}
.gridt{grid-template-columns:repeat(4,1fr);gap:8px}.tile{background:#102131;border:1px solid #263f53;border-radius:12px;font-size:25px}.tile small{color:#f3d36b}.tile.ow{box-shadow:inset 0 0 0 1px #63dfc1}.tile.sel{outline:2px solid #f3d36b}
#toast{background:#17283a;border:1px solid #63dfc1;border-radius:12px;box-shadow:0 8px 25px #0005}
.pfb{background:#172f43;border:1px solid #2b4a61;box-shadow:none;border-radius:16px}.pfb::after{display:none}.tls{gap:8px}.tl{background:#17283a;border:1px solid #2a4052;border-radius:12px}.tl b{color:#f3d36b}
.rb2{box-shadow:none;border:1px solid rgba(255,255,255,.25)}
/* tidy tap states and consistent 2D palette */
button,.tile{ -webkit-tap-highlight-color:transparent }
.nav button{min-width:0;padding-left:2px;padding-right:2px;font-size:22px}
.pn,.card{box-shadow:none}
.wall svg{height:250px}
.wall{background:linear-gradient(180deg,#19364a 0%,#123044 78%,#102b3e 100%)}
.wall::after{background:repeating-linear-gradient(90deg,#174353 0 34px,#153d4b 34px 68px)}
.skill-choice{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:#1d3a4c;color:#edf7fb;text-align:left;border:1px solid #2b4a60;border-radius:12px;margin:7px 0;box-shadow:none}
.skill-choice:active{background:#24485b}
.skill-choice .si{font-size:23px;width:32px;text-align:center}
.skill-choice .sd{flex:1;min-width:0}
.skill-choice .sd b{display:block;font-size:14px;font-weight:650}
.skill-choice .sd small{display:block;color:#91a8bc;font-size:12px;margin-top:3px}
.skill-choice .gain{color:#63dfc1;font-size:12px;font-weight:700;white-space:nowrap}
.command-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.command-row .b{padding:14px 8px;font-size:15px}
.stat-head{display:flex;justify-content:space-between;align-items:center;margin:9px 0 4px;font-size:13px}

@media(prefers-reduced-motion:no-preference){button,.tile,.pn{transition:background .15s ease,border-color .15s ease,transform .15s ease}.b:active{transform:scale(.985)}}


/* Competitive progression + animated podium */
.podium-scene{height:155px;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:7px;margin:0 0 12px;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at 50% 100%,rgba(99,223,193,.2),transparent 65%),linear-gradient(180deg,#13273a,#0c1825)}
.podium-blocks{height:64px;display:flex;align-items:flex-end;gap:5px;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.podium-blocks i{display:flex;align-items:flex-start;justify-content:center;padding-top:7px;width:66px;border-radius:7px 7px 0 0;font-size:19px;font-style:normal;font-weight:700;color:#0b1521;box-shadow:inset 0 3px 0 rgba(255,255,255,.25)}
.podium-second{height:48px;background:linear-gradient(#d7e1ea,#8199ae)}
.podium-first{height:64px;background:linear-gradient(#ffe18a,#c9942c)}
.podium-third{height:38px;background:linear-gradient(#e8ad83,#9e5b35)}
.podium-swimmer{position:absolute;z-index:2;bottom:65px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;animation:podium-rise .85s cubic-bezier(.2,.8,.2,1) both}
.podium-swimmer span{font-size:36px;filter:drop-shadow(0 3px 4px #0008)}
.podium-swimmer b{font-size:13px;background:#0b1521d9;border:1px solid #63dfc1;border-radius:20px;padding:3px 9px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-swimmer small{font-size:10px;color:#9cebd8;letter-spacing:1.5px}
@keyframes podium-rise{from{opacity:0;transform:translate(-50%,24px) scale(.86)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.podium-first{animation:podium-glow 1.8s ease-in-out infinite alternate}
@keyframes podium-glow{from{filter:brightness(.95)}to{filter:brightness(1.2)}}
@media(prefers-reduced-motion:reduce){.podium-swimmer,.podium-first{animation:none}}

/* ===== Visual polish v2: teal "Swim!" look ===== */
:root{--bl:#3a95f2;--ln:rgba(128,160,170,.22);--sh:0 6px 18px rgba(0,0,0,.28)}
html{background:var(--b2)}

body::before{background:var(--h2)!important}

.cal{background:rgba(255,255,255,.16)!important;border-radius:9px!important}

.wall{background:repeating-linear-gradient(90deg,var(--w1) 0 20px,var(--w2) 20px 40px)!important}

.wall::after{background:linear-gradient(var(--w2),var(--b2))!important;box-shadow:0 -3px 8px rgba(0,0,0,.3)}

.arw{color:#bff5e0!important;text-shadow:0 2px 8px rgba(0,0,0,.5);opacity:.9}
.pn,.card{background:linear-gradient(180deg,var(--p1),var(--p2))!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:16px!important;box-shadow:var(--sh)!important;margin:12px 10px!important;padding:14px!important}
h3{color:var(--g2);letter-spacing:1.2px;font-weight:600}
.m{color:var(--m)}
button,select,input{border-radius:10px}
.b{background:linear-gradient(var(--a1),var(--a2))!important;color:var(--on)!important;border-radius:12px!important;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 4px 10px rgba(0,0,0,.25)!important;text-shadow:0 1px 0 rgba(255,255,255,.3);}

function newSeasonBase(ok){g.year++;g.meet=0;g.q=false;g.olympicQualified=false;g.ss={};g.wk+=12;g.load=0;if(ok){const b=Math.max(500,g.rating*25);g.coins+=b;toast("Сезон завершён! Бонус +"+b+" AC")}else toast("Отбор не пройден — новый сезон начинается с районных стартов")}

const _oldCareer=vCareerBase, _oldMore=vMoreBase;
const ASSETS=[
 {id:'flat1',n:'Студия у бассейна',e:'🏢',p:65000,kind:'Квартира',base:65000},

 {id:'car1',n:'Городской хэтчбек',e:'🚗',p:18000,kind:'Автомобиль',base:18000},
 {id:'car2',n:'Спортивное купе',e:'🏎️',p:72000,kind:'Автомобиль',base:72000},

];
function marketValue(a){const years=Math.max(0,g.year-(a.buyYear||g.year));const annual=a.kind==='Автомобиль'?-.075:(a.kind==='Квартира'?.045:.035);return Math.max(a.kind==='Автомобиль'?a.base*.18:a.base*.55,Math.round(a.price*Math.pow(1+annual,years)*(1+Math.sin((g.year+(a.id.length*3))*1.4)*.025)))}
function assetPanel(){g.assets=g.assets||[];const owned=g.assets;const labels=ASSETS.map(a=>`<div class="pbr"><span style="font-size:28px">${a.e}</span><div style="flex:1"><b>${a.n}</b><div class="m">${a.kind} · цена ${a.p.toLocaleString('ru')} AC</div></div><button class="b y" ${g.coins<a.p?'disabled':''} onclick="buyAsset('${a.id}')">Купить</button></div>`).join('');
const hist=owned.map(a=>{const now=marketValue(a),start=a.price;return `<div class="pn"><div class="row"><b>${a.e} ${a.n}</b><span class="tag">${now>=start?'+':'−'}${Math.round(Math.abs(now-start)/start*100)}%</span></div><div class="m">Куплено в сезоне ${a.buyYear} за ${start.toLocaleString('ru')} AC · сейчас ${now.toLocaleString('ru')} AC</div><svg viewBox="0 0 300 70" width="100%" height="70" role="img" aria-label="График стоимости имущества">${(()=>{let pts=[];for(let i=0;i<=10;i++){const yr=a.buyYear+i;const val=Math.max(a.kind==='Автомобиль'?a.base*.18:a.base*.55,Math.round(a.price*Math.pow(1+(a.kind==='Автомобиль'?-.075:(a.kind==='Квартира'?.045:.035)),i)*(1+Math.sin((yr+(a.id.length*3))*1.4)*.025)));pts.push([10+i*28,60-(val/(a.price*1.6))*48])}return `<polyline points="${pts.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#63dfc1" stroke-width="3"/>`})()}</svg><div class="m">Прогноз на ${a.buyYear+10}: ${Math.round(Math.max(a.kind==='Автомобиль'?a.base*.18:a.base*.55,a.price*Math.pow(1+(a.kind==='Автомобиль'?-.075:(a.kind==='Квартира'?.045:.035)),10))).toLocaleString('ru')} AC. Игровая модель, не реальная оценка рынка.</div></div>`}).join('');
return `<div class="ttl">🏠 Имущество и транспорт</div><div class="pn"><div class="m">Покупай недвижимость и машины за игровые AC. Цена зависит от сезона: квартиры обычно дорожают, машины теряют стоимость. Колебания случайно-модельные, не прогноз реального рынка.</div><div class="tls"><div class="tl"><span>Активы</span><b>${owned.length}</b></div><div class="tl"><span>Текущая стоимость</span><b>${owned.reduce((n,a)=>n+marketValue(a),0).toLocaleString('ru')} AC</b></div></div>${labels}</div>${hist||'<div class="pn m">Пока нет имущества — купи первый актив выше.</div>'}`}
function buyAsset(id){const a=ASSETS.find(x=>x.id===id);if(!a||g.coins<a.p)return;g.coins-=a.p;g.assets=g.assets||[];g.assets.push({...a,price:a.p,buyYear:g.year});save();toast('Куплено: '+a.n);render(1)}
function newsPanel(){const hist=(g.hist||[]).slice(-12).reverse();const headlines=hist.map((h,i)=>{const tone=h.p===1?'🔥 Сенсация сезона':h.p<=3?'🏆 На пьедестале':'📣 Обсуждают выступление';return `<div class="pbr"><span style="font-size:25px">${h.p===1?'🥇':h.p<=3?'🥈':'📰'}</span><div style="flex:1"><b>${tone}: ${g.name}</b><div class="m">${h.y} · ${h.m} · ${h.d} м ${STR[h.s]} за ${fmt(h.t)} — ${h.p===1?'победа!':h.p<=3?'медаль в копилке.':'новый опыт и повод вернуться сильнее.'}</div></div></div>`}).join('');return `<div class="ttl">📰 Новости и репутация</div><div class="pn"><div class="m">Новости создаются по событиям твоей карьеры. Сплетни — игровые слухи, не реальные публикации.</div><div class="pbr"><span style="font-size:28px">📈</span><div><b>${g.name} — ${g.rating>=75?'имя всё чаще звучит в спортивных медиа':g.rating>=50?'привлекает внимание тренеров и клубов':'начинает заявлять о себе'}</b><div class="m">Репутация ${g.rating} · медали ${g.medals}</div></div></div>${headlines||'<div class="m">Пока тихо: проплыви первый старт, чтобы появились первые публикации.</div>'}</div>`}
function commercialPanel(){g.contracts=g.contracts||[];return `<div class="ttl">💼 Коммерческие старты</div><div class="pn"><div class="m">Выбери взнос. Чем выше ставка, тем больше потенциальная выплата — но проигрыш уменьшит баланс. Это внутриигровая механика.</div><label class="m">Сумма участия (AC)</label><input id="stake" type="number" min="100" step="100" value="500"><label class="m">Тип старта</label><select id="commercialType"><option value="local">Коммерческий спринт · ×1.7</option><option value="pro">Pro Invitational · ×2.4 (нужна репутация 60)</option><option value="elite">Elite Series · ×3 (нужна репутация 80)</option></select><button class="b y w" onclick="enterCommercial()">Подать заявку</button></div><div class="pn"><h3>История контрактов</h3>${(g.commercialLog||[]).slice().reverse().map(x=>`<div class="pbr"><span>📄</span><div style="flex:1"><b>${x.name}</b><div class="m">Ставка ${x.stake} AC · ${x.outcome}</div></div><b>${x.delta>0?'+':''}${x.delta} AC</b></div>`).join('')||'<div class="m">Пока нет коммерческих стартов.</div>'}</div>`}
